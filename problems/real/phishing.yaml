dataset: phishing
dataset_params:
  init_size: "expr: max(2*d, N_train/100)"
  test_size: 0.2
  param_dim: 39
  n_dataset: 11055

log_test_every_n_batches: 10
log_train_every_n_batches: 10

optimal_lr: 1.0
init_theta: true

model: logistic_regression
model_params:
  bias: true
  lambda_: "expr: 1 / N_train"